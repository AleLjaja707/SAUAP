<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Asignación</title>
    <!--<h:outputStylesheet library="primefaces-saga" name="theme.css"/>-->
    <link rel="stylesheet"  type="text/css"  href="resources/css/style.css"/>
    <style>
        .registro {
            color: #594646;
            background-color: #FFFFFF;
            padding: 25px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
            max-width: 1100px;
        }

        .labels {
            font-size: 20px;
            font-weight: bold;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

    </style>

</h:head>

<h:body>
    <h:form>
        <div class="menu_lateral">

            <div class="logo_sauap"><img src="resources/images/logoAz.png" width="50" height="50"/><span style="font-size: 40px; font-weight: bold;">SAUAP</span></div>

            <div class="menu_opciones">
                <h:link outcome="profesor" styleClass="menu_btn"><img src="resources/images/iconAgreProfe.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Alta de profesores</span></h:link>
                <h:link outcome="unidad" styleClass="menu_btn"><img src="resources/images/iconAgreMateria.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Unidad de aprendizaje</span></h:link>
                <h:link outcome="asignacion" styleClass="menu_btn"><img src="resources/images/iconAsignar.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Asignaciones</span></h:link>
                <h:link outcome="consultas" styleClass="menu_btn"><img src="resources/images/iconConsultar.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Consultas</span></h:link>
            </div>

            <h:link outcome="login" styleClass="menu_btn cerrar_sesion"><img src="resources/images/iconSalir.png" width="30" height="30"/><span style="font-size: 20px; font-weight: bold;">Cerrar Sesión</span></h:link>

        </div>
    </h:form>

    <div class="contenido">
        <h1>Asignación de Unidad a Profesor</h1>

            <div class="registro">
                <h:form id="formAsignacion">
                    <p:growl id="msgs" showDetail="true" sticky="false" life="4000" />
                    <h2>Nueva Asignación</h2>

                    <h:panelGroup layout="block" style="display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap;">

                        <div class="campo">
                            <p:outputLabel value="Profesor*" styleClass="labels"/>
                            <p:selectOneMenu value="#{asignacionBean.idProfesor}" required="true" requiredMessage="Debes seleccionar a un profesor.">
                                <f:selectItem itemLabel="Seleccione un profesor" itemValue="#{null}"/>
                                <f:selectItems value="#{asignacionBean.profesores}" var="p"
                                               itemLabel="#{p.nombre} #{p.apellidoP} #{p.apellidoM}" itemValue="#{p.id}"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="campo">
                            <p:outputLabel value="Unidad de Aprendizaje*" styleClass="labels"/>
                            <p:selectOneMenu value="#{asignacionBean.idUnidadAprendizaje}" required="true" requiredMessage="Debes seleccionar una unidad de aprendizaje.">
                                <f:selectItem itemLabel="Seleccione una unidad" itemValue="#{null}"/>
                                <f:selectItems value="#{asignacionBean.unidades}" var="u"
                                               itemLabel="#{u.nombre}" itemValue="#{u.idUnidad}"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="campo">
                            <p:outputLabel value="Día*" styleClass="labels"/>
                            <p:selectOneMenu value="#{asignacionBean.diaSemana}" required="true" requiredMessage="Debes seleccionar un día de la semana.">
                                <f:selectItem itemLabel="Seleccione un día" itemValue="#{null}"/>
                                <f:selectItems value="#{asignacionBean.diasSemana}"/>
                            </p:selectOneMenu>
                        </div>

                        <div class="campo">
                            <p:outputLabel value="Hora Inicio*" styleClass="labels"/>
                            <p:datePicker value="#{asignacionBean.horaInicio}" timeOnly="true" pattern="HH:mm" timeInput="true" required="true" requiredMessage="Debe ingresar la hora de inicio."/>
                        </div>

                        <div class="campo">
                            <p:outputLabel value="Hora Fin*" styleClass="labels"/>
                            <p:datePicker value="#{asignacionBean.horaFin}" timeOnly="true" pattern="HH:mm" timeInput="true" required="true" requiredMessage="Debe ingresar la hora de fin."/>
                        </div>

                    </h:panelGroup>

                    <div style="margin-top: 25px;">
                        <p:commandButton value="Asignar" action="#{asignacionBean.asignar}" update="@form" process="@form"/>
                    </div>
                </h:form>
            </div>

            <br/><br/>
    </div>
    </h:body>
    </html>
