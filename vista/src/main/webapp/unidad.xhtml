<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Unidades de Aprendizaje</title>
    <!--<h:outputStylesheet library="primefaces-saga" name="theme.css"/>-->
    <h:outputStylesheet name ="style.css" />
</h:head>

<h:body>
    <h:form>
        <div class="menu_lateral" style="background-color: #F8EDEB;">
            <h2>SAUAP</h2>
            <p:button value="Alta de profesores" outcome="profesor" styleClass="menu_btn"/>
            <p:button value="Unidades de aprendizaje" outcome="unidad" styleClass="menu_btn" />
            <p:button value="Asignacion de materias" outcome="asignacion" styleClass="menu_btn" />
            <p:button value="Consultas" outcome="consultas" styleClass="menu_btn" />

        </div>
    </h:form>

<div class="contenido">

    <h1>Registro de Unidad Académica</h1>

    <h:form>

        <h2>Datos de Unidad de Aprendizaje</h2>

        <div style="display: flex; gap: 25px; align-items: flex-end;">

            <div>
                <p:outputLabel value="Nombre de la unidad*" />
                <br/>

                <p:inputText value="#{unidadABean.nombre}"
                              placeholder="Ej. Programación" />
            </div>

            <div>
                <p:outputLabel value="Horas de clase*" />
                <br/>
                <p:spinner value="#{unidadABean.horasClase}" min="0" max="4" />

            </div>

            <div>
                <p:outputLabel value="Horas de taller*" />
                <br/>
                <p:spinner value="#{unidadABean.horasTaller}" min="0" max="4" />

            </div>

            <div>
                <p:outputLabel value="Horas de laboratorio*" />
                <br/>
                <p:spinner value="#{unidadABean.horasLab}" min="0" max="4" />

            </div>

        </div>

        <br/>

        <p:commandButton value="Guardar"
                         action="#{unidadABean.guardarUnidad}" />

    </h:form>

</div>
</h:body>

</html>
