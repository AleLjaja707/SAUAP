<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Registro de Profesor</title>
        <!--<h:outputStylesheet library="primefaces-saga" name="theme.css"/>-->
        <link rel="stylesheet"  type="text/css"  href="resources/css/style.css"/>
        <style>
            .registro {
                color: #594646;
                background-color: #FFFFFF;
                padding: 25px;
                margin-top: 20px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
                max-width: 1100px;
            }
            .btn_guardar {
                display: inline-block;

                background-color: #b8d4fd;
                color: #FFFFFF;

                padding: 12px 25px;

                border-radius: 8px;
                border: none;

                font-size: 16px;
                font-weight: bold;

                text-decoration: none;
                text-align: center;

                cursor: pointer;
            }

            .btn_guardar:hover {
                background-color: #dde7f6;
                color: #FFFFFF;
            }

            .labels{
                font-size: 20px;
                font-weight: bold;

            }
            .campo {
                display: flex;
                flex-direction: column;
            }

        </style>
    </h:head>

    <h:body>
        <h:form>
            <div class="menu_lateral">

                <div class="logo_sauap"><img src="resources/images/logoAz.png" width="50" height="50"/><span style="font-size: 40px; font-weight: bold;">SAUAP</span></div>

                <div class="menu_opciones">
                    <h:link outcome="profesor" styleClass="menu_btn"><img src="resources/images/iconAgreProfe.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Alta de profesores</span></h:link>
                    <h:link outcome="unidad" styleClass="menu_btn"><img src="resources/images/iconAgreMateria.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Unidad de aprendizaje</span></h:link>
                    <h:link outcome="asignacion" styleClass="menu_btn"><img src="resources/images/iconAsignar.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Asignaciones</span></h:link>
                    <h:link outcome="consultas" styleClass="menu_btn"><img src="resources/images/iconConsultar.png" width="30" height="30"/> <span style="font-size: 20px; font-weight: bold;">Consultas</span></h:link>
                </div>

                <h:link outcome="login" styleClass="menu_btn cerrar_sesion"><img src="resources/images/iconSalir.png" width="30" height="30"/><span style="font-size: 20px; font-weight: bold;">Cerrar Sesión</span></h:link>

            </div>
        </h:form>


        <div class="contenido">
            <h1>Registro de Profesor</h1>
            <div class="registro">
            <!-- Formulario de registro-->
                <h:form>

                    <h2>Datos del Profesor</h2>

                    <div style="display: flex; gap: 25px; align-items: flex-end;">
                        <div class="campo"><p:outputLabel value="Nombre*" styleClass="labels"/><br/><p:inputText value="#{profesorBean.nombre}" placeholder="Ej. Alejandro" /></div>
                        <div class="campo"><p:outputLabel value="Apellido paterno*" styleClass="labels"/><br/><p:inputText value="#{profesorBean.apellidoPaterno}" placeholder="Ej. Rojas"/></div>
                        <div class="campo"><p:outputLabel value="Apellido materno*" styleClass="labels"/><br/><p:inputText value="#{profesorBean.apellidoMaterno}" placeholder="Ej. Lopez"/></div>
                        <div class="campo"><p:outputLabel value="RFC*" styleClass="labels"/><br/><p:inputText value="#{profesorBean.rfc}" placeholder="Ej. LOGJ580812RH7"/></div>
                    </div>

                <br/>
                <h:commandLink value="Guardar" action="#{profesorBean.guardarProfesor}" update="@form" resetValues="true" styleClass="btn_guardar"/>

                </h:form>
            </div>
        </div>

    </h:body>



</html>
